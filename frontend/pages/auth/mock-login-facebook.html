<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Log in to Facebook | Facebook</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 400px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
            text-align: center;
        }
        .logo {
            width: 200px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            color: #1c1e21;
            margin-bottom: 20px;
            font-weight: normal;
        }
        .btn-fb {
            background: #1877f2;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin: 20px 0;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-fb:hover {
            background: #166fe5;
        }
        .footer {
            border-top: 1px solid #dddfe2;
            padding-top: 20px;
            font-size: 14px;
            color: #606770;
        }
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .fb-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1877f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/y98-Bbc18H-.svg" class="logo" alt="Facebook">
        <h2>Đăng nhập để sử dụng tài khoản Facebook của bạn với <strong>TechEcommerce</strong></h2>

        <button class="btn-fb" onclick="login()">Tiếp tục dưới tên Phi Long</button>
        
        <div class="footer">
            Bằng cách tiếp tục, TechEcommerce sẽ có quyền truy cập vào tên và ảnh đại diện của bạn.
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="fb-spinner"></div>
        <div style="font-size: 16px; color: #1877f2;">Đang kết nối với TechEcommerce...</div>
    </div>

    <script>
        function login() {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'social-login-success',
                        user: { name: 'Vũ Phi Long (FB)', email: 'philong_fb@example.com', provider: 'Facebook' }
                    }, '*');
                }
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
