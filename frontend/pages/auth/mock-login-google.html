<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sign in - Google Accounts</title>
    <style>
        body {
            font-family: 'Roboto', arial, sans-serif;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #202124;
        }
        .container {
            width: 450px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }
        .logo {
            width: 75px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            margin-bottom: 40px;
        }
        .account-box {
            display: flex;
            align-items: center;
            padding: 12px;
            border-top: 1px solid #dadce0;
            border-bottom: 1px solid #dadce0;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }
        .account-box:hover {
            background: #f1f3f4;
        }
        .avatar {
            width: 30px;
            height: 30px;
            background: #6366f1;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
        }
        .info {
            display: flex;
            flex-direction: column;
        }
        .name {
            font-weight: 500;
            font-size: 14px;
        }
        .email {
            font-size: 12px;
            color: #5f6368;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #5f6368;
            text-align: left;
        }
        /* Loader */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo" alt="Google">
        <h1>Chọn một tài khoản</h1>
        <p>để tiếp tục đến TechEcommerce</p>

        <div class="account-box" onclick="selectAccount('Vũ Phi Long', 'vuphilong@gmail.com')">
            <div class="avatar">V</div>
            <div class="info">
                <span class="name">Vũ Phi Long</span>
                <span class="email">vuphilong@gmail.com</span>
            </div>
        </div>
        
        <div class="account-box" onclick="selectAccount('Guest User', 'guest@shopmini.vn')">
            <div class="avatar" style="background: #020617;">G</div>
            <div class="info">
                <span class="name">Sử dụng tài khoản khác</span>
            </div>
        </div>

        <div class="footer">
            Để tiếp tục, Google sẽ chia sẻ tên, địa chỉ email, tùy chọn ngôn ngữ và ảnh hồ sơ của bạn với TechEcommerce.
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 16px;">Đang xác thực với TechEcommerce...</div>
    </div>

    <script>
        function selectAccount(name, email) {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                // Mock success return
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'social-login-success',
                        user: { name, email, provider: 'Google' }
                    }, '*');
                }
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
