    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Theo dõi trạng thái xử lý, thanh toán và vận chuyển đơn hàng TechEcommerce.">
    <meta name="robots" content="noindex, nofollow">

    <title>Đơn hàng của tôi - TechEcommerce</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/neo-circuit.css?v=site-font-20260715-2">
    <style>
        .orders-shell { display: grid; gap: 1rem; }
        .order-card {
            padding: 1.4rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        .order-head {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .order-head h3 { margin: 0; }
        .order-head p { color: var(--text-muted); margin-top: 0.2rem; }
        .order-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .pay-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .pay-paid { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .pay-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .pay-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .order-products-list {
            display: grid;
            gap: 0.45rem;
            margin-bottom: 1rem;
        }
        .order-products-list li,
        .order-meta-grid div {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }
        .order-products-list span,
        .order-meta-grid dd {
            color: var(--text-secondary);
            text-align: right;
        }
        .order-meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.7rem 1.5rem;
        }
        .order-products-list { list-style: none; padding: 0; }
        .order-meta-grid dd { margin: 0; }
        .money { color: var(--primary) !important; font-weight: 800; }
        .order-actions {
            margin-top: 1.2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .order-tracking-link { text-decoration: none; }
        @media (max-width: 700px) {
            .order-head { flex-direction: column; }
            .order-meta-grid { grid-template-columns: 1fr; }
            .order-products-list li,
            .order-meta-grid div { flex-direction: column; gap: 0.2rem; }
            .order-products-list span,
            .order-meta-grid dd { text-align: left; }
        }
    </style>
</head>

<body>
    <nav>
        <p class="legacy-brand"><a href="../../index.html">TechEcommerce</a></p>
        <ul id="main-navbar">
            <li><a href="../../index.html">Cửa hàng</a></li>
            <li><a href="orders.html" class="active">Đơn hàng</a></li>
            <li><a href="profile.html">Hồ sơ</a></li>
            <li class="admin-only"><a href="../../admin/dashboard.html?v=techecommerce-20260709-2">Tổng quan</a></li>
            <li id="nav-auth-section" style="margin-left: auto;"></li>
        </ul>
    </nav>
    <script src="../../assets/js/animations.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/storefront-header.js?v=navigation-sync-20260712-2"></script>

    <main class="container fade-in">
        <header class="page-header reveal">
            <h1>Đơn hàng của tôi</h1>
            <p>Theo dõi trạng thái xử lý, thanh toán và vận chuyển.</p>
        </header>
        <section class="stats-grid reveal" aria-label="Thống kê đơn hàng" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
            <article class="stat-card">
                <div class="stat-icon">ORD</div>
                <div class="stat-value" id="orderCount">0</div>
                <div class="stat-label">Tổng đơn</div>
            </article>
        </section>
        <section id="ordersList" class="orders-shell reveal" aria-label="Danh sách đơn hàng">
            <div class="empty-state">Đang tải đơn hàng...</div>
        </section>
    </main>

    <script src="../../assets/js/my-orders.js?v=order-flow-20260720-1"></script>
    <script src="../../assets/js/footer.js?v=navigation-sync-20260712-1"></script>
    <script src="../../assets/js/chatbox.js"></script>
</body>

</html>
