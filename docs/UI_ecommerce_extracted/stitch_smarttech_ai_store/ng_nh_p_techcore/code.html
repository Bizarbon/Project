<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TechCore - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-container": "#4b8eff",
                      "surface": "#101415",
                      "on-secondary-container": "#adb4ce",
                      "on-background": "#e0e3e5",
                      "inverse-surface": "#e0e3e5",
                      "surface-container": "#1d2022",
                      "surface-tint": "#adc6ff",
                      "surface-container-low": "#191c1e",
                      "on-secondary": "#283044",
                      "on-primary-fixed-variant": "#004493",
                      "primary-fixed-dim": "#adc6ff",
                      "on-surface": "#e0e3e5",
                      "on-secondary-fixed-variant": "#3f465c",
                      "surface-container-highest": "#323537",
                      "inverse-on-surface": "#2d3133",
                      "on-error": "#690005",
                      "primary": "#adc6ff",
                      "error": "#ffb4ab",
                      "outline-variant": "#414755",
                      "on-tertiary": "#00354a",
                      "tertiary-fixed-dim": "#7bd0ff",
                      "tertiary-container": "#009bd1",
                      "secondary-fixed-dim": "#bec6e0",
                      "on-tertiary-container": "#002d40",
                      "surface-dim": "#101415",
                      "secondary-container": "#3f465c",
                      "secondary-fixed": "#dae2fd",
                      "on-primary": "#002e69",
                      "primary-fixed": "#d8e2ff",
                      "on-tertiary-fixed": "#001e2c",
                      "tertiary": "#7bd0ff",
                      "on-surface-variant": "#c1c6d7",
                      "tertiary-fixed": "#c4e7ff",
                      "surface-bright": "#363a3b",
                      "outline": "#8b90a0",
                      "background": "#101415",
                      "surface-container-high": "#272a2c",
                      "error-container": "#93000a",
                      "inverse-primary": "#005bc1",
                      "on-secondary-fixed": "#131b2e",
                      "on-primary-container": "#00285c",
                      "on-primary-fixed": "#001a41",
                      "secondary": "#bec6e0",
                      "on-error-container": "#ffdad6",
                      "surface-variant": "#323537",
                      "surface-container-lowest": "#0b0f10",
                      "on-tertiary-fixed-variant": "#004c69"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "20px",
                      "gutter": "24px",
                      "margin-desktop": "64px",
                      "container-max": "1280px",
                      "base": "8px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "label-sm": ["JetBrains Mono"],
                      "headline-md": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "display-lg": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .circuit-bg {
            background-color: #101415;
            background-image: radial-gradient(circle at 100% 150%, rgba(75, 142, 255, 0.05) 24%, transparent 24%), radial-gradient(circle at 100% 150%, rgba(75, 142, 255, 0.05) 24%, transparent 24%);
            background-size: 100px 100px;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 41, 59, 1);
            box-shadow: 0 20px 50px rgba(75, 142, 255, 0.05);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 1px #4b8eff, 0 0 10px rgba(75, 142, 255, 0.2);
            border-color: #4b8eff;
            outline: none;
        }

        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(75, 142, 255, 0.5);
        }
        
        /* Material Icon Font Settings */
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md circuit-bg relative overflow-hidden">
<!-- Ambient glowing orbs in background -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-container opacity-5 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] rounded-full bg-tertiary-container opacity-10 blur-[100px] pointer-events-none"></div>
<!-- Navigation suppressed per rules (Login is Transactional) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10 w-full relative">
<!-- Login Card -->
<div class="glass-card rounded-xl w-full max-w-md p-8 flex flex-col gap-8 relative overflow-hidden">
<!-- Subtle top border highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<!-- Header -->
<div class="text-center flex flex-col items-center gap-2">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">terminal</span>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary">TechCore</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Console Access</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email/Username -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">IDENTIFIER</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50">person</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-outline-variant input-glow transition-all duration-200" id="email" name="email" placeholder="Email or Username" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">AUTHORIZATION KEY</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50">lock</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-12 text-on-surface placeholder:text-outline-variant input-glow transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="appearance-none w-4 h-4 rounded-[4px] border border-outline-variant bg-surface-container-high checked:bg-primary checked:border-primary transition-colors cursor-pointer input-glow" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Node</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white rounded-lg py-3 font-label-sm text-label-sm uppercase tracking-wider flex items-center justify-center gap-2 mt-2 btn-glow transition-all duration-300" type="submit">
<span>Initialize Session</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant flex-grow opacity-50"></div>
<span class="font-label-sm text-label-sm text-outline-variant">OR CONNECT VIA</span>
<div class="h-px bg-outline-variant flex-grow opacity-50"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4 justify-center">
<button class="w-12 h-12 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary flex items-center justify-center transition-all duration-200 group">
<!-- Generic Google Icon Representation -->
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">language</span>
</button>
<button class="w-12 h-12 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary flex items-center justify-center transition-all duration-200 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">public</span>
</button>
<button class="w-12 h-12 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary flex items-center justify-center transition-all duration-200 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">smartphone</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="text-center mt-2">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    No active credentials? 
                    <a class="text-primary hover:text-primary-fixed underline decoration-primary/30 underline-offset-4 transition-colors ml-1" href="#">Request Access</a>
</p>
</div>
</div>
</main>
<!-- Footer generated from JSON, but contextually suppressed on a login screen per instructions (Linear/Transactional). -->
<!-- Kept completely empty to satisfy the "Destination Rule / Automatic Suppression" -->
<script>
        // Micro-interaction for checkbox icon logic (handled mostly by CSS peer/checked, but keeping structural intent clear)
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => {
            // Ensure the span following the checkbox acts as the checkmark
            const span = cb.nextElementSibling;
            if(span && span.classList.contains('material-symbols-outlined')) {
                cb.classList.add('peer'); // Add peer class dynamically if missing for CSS logic
            }
        });
    </script>
</body></html>
