<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background circular gradient -->
    <linearGradient id="aiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0068FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>

    <!-- Robot faceplate metallic gradient -->
    <linearGradient id="aiFaceplate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Visor dark glass gradient -->
    <linearGradient id="aiVisorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Cyan glowing LED visor eyes -->
    <linearGradient id="aiLedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Ear headphones accent -->
    <linearGradient id="aiEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00F5D4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#aiBgGrad)"/>

  <!-- Outer Ring Accent -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Antenna Stem & Node -->
  <rect x="48" y="12" width="4" height="12" rx="2" fill="#E2E8F0"/>
  <circle cx="50" cy="12" r="5" fill="#00F5D4" filter="url(#aiGlow)"/>
  <circle cx="50" cy="12" r="2.5" fill="#FFFFFF"/>

  <!-- Left & Right Headphone Ear Pods -->
  <rect x="14" y="44" width="8" height="20" rx="4" fill="url(#aiEarGrad)"/>
  <rect x="16" y="48" width="4" height="12" rx="2" fill="#00F5D4"/>
  <rect x="78" y="44" width="8" height="20" rx="4" fill="url(#aiEarGrad)"/>
  <rect x="80" y="48" width="4" height="12" rx="2" fill="#00F5D4"/>

  <!-- Main Robot Head Chassis -->
  <rect x="20" y="24" width="60" height="56" rx="20" fill="url(#aiFaceplate)"/>

  <!-- Visor Screen -->
  <rect x="25" y="34" width="50" height="34" rx="14" fill="url(#aiVisorBg)"/>

  <!-- Friendly Glowing Visor Eyes (Smiling curved capsule eyes) -->
  <!-- Left Eye -->
  <path d="M34 50 C34 44 42 44 42 50 C42 54 34 54 34 50 Z" fill="url(#aiLedGrad)" filter="url(#aiGlow)"/>
  <circle cx="38" cy="48" r="1.5" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <path d="M58 50 C58 44 66 44 66 50 C66 54 58 54 58 50 Z" fill="url(#aiLedGrad)" filter="url(#aiGlow)"/>
  <circle cx="62" cy="48" r="1.5" fill="#FFFFFF"/>

  <!-- Cute AI Smile Curve -->
  <path d="M44 57 Q50 62 56 57" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Small AI Chest / Collar Tag -->
  <path d="M41 80 L59 80 L56 86 L44 86 Z" fill="#0284C7"/>
</svg>
