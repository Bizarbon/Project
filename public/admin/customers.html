<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@500;600;700&amp;display=swap&amp;subset=vietnamese">
    <meta name="description" content="Quản trị hồ sơ và lịch sử mua hàng của khách hàng TechEcommerce.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://techecommerce-shop.vercel.app/admin/customers.html">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Quản lý khách hàng - TechEcommerce</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=techecommerce-20260709-2">
    <link rel="stylesheet" href="../assets/css/neo-circuit.css?v=admin-layout-20260715-2">
</head>

<body class="admin-page">
    <header class="admin-sidebar"><nav aria-label="Điều hướng quản trị">
        <p class="admin-brand"><a href="../index.html">TechEcommerce Admin</a></p>
        <ul id="main-navbar">
            <li><a href="dashboard.html?v=techecommerce-20260709-2">Tổng quan</a></li>
            <li><a href="products.html?v=techecommerce-20260709-2">Sản phẩm</a></li>
            <li><a href="orders.html?v=techecommerce-20260709-2">Đơn hàng</a></li>
            <li><a href="customers.html?v=techecommerce-20260709-2" class="active">Khách hàng</a></li>
            <li><a href="coupons.html?v=techecommerce-20260709-2">Mã giảm giá</a></li>
            <li><a href="finance.html?v=techecommerce-20260709-2">Tài chính</a></li>
            <li><a href="suppliers.html?v=techecommerce-20260709-2">Nhà cung cấp</a></li>
            <li id="nav-auth-section" style="margin-left: auto;"></li>
        </ul>
    </nav></header>
    <script src="../assets/js/animations.js?v=techecommerce-20260709-2"></script>
    <script src="../assets/js/auth.js?v=techecommerce-20260709-2"></script>

    <main class="container fade-in">
        <header class="page-header reveal">
            <h1>Quản lý khách hàng</h1>
            <p>Quản lý hồ sơ khách hàng, liên hệ và lịch sử mua hàng.</p>
        </header>

        <section class="form-section glass-card reveal">
            <h2><span id="formTitle">Thêm khách hàng mới</span></h2>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" placeholder="Nhập họ tên khách hàng..." required>
                </div>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="vuphilong, ..." required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu ban đầu</label>
                    <input type="password" id="password" minlength="8" maxlength="72" autocomplete="new-password"
                        placeholder="Có chữ hoa, chữ thường và số">
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="text" id="phone" placeholder="09xxxxxxxx" required>
                </div>
                <div class="form-group full-width">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" placeholder="Nhập địa chỉ nhận hàng...">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Lưu khách hàng</button>
                    <button type="button" class="btn-secondary" onclick="resetForm()">Hủy bỏ</button>
                </div>
            </form>
        </section>

        <section class="table-section glass-card reveal">
            <h2>Danh sách khách hàng (<span id="customerCount">0</span>)</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th>Họ tên</th>
                            <th>Tên đăng nhập</th>
                            <th>SĐT</th>
                            <th>Email</th>
                            <th>Địa chỉ</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="customerTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../assets/js/customers.js?v=techecommerce-20260709-2"></script>
    <script src="../assets/js/footer.js?v=full-admin-footer-20260715-2"></script>
</body>

</html>
